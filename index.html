<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>TETRIS</title>

  <!-- Only external resource. The game must stay playable if this fails (monospace fallback). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">

  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div class="cabinet" id="cabinet">
    <header class="marquee">
      <h1 class="logo">TETRIS</h1>
    </header>

    <main class="playarea">
      <aside class="panel">
        <section class="box">
          <h2 class="box__title">HOLD</h2>
          <canvas id="hold-canvas" class="pixel-canvas pixel-canvas--hold" width="80" height="48"></canvas>
        </section>

        <section class="box">
          <dl class="stats">
            <dt>SCORE</dt>
            <dd id="hud-score">000000</dd>
            <dt>TOP</dt>
            <dd id="hud-hiscore">000000</dd>
          </dl>
        </section>
      </aside>

      <div class="well" id="well">
        <canvas id="board-canvas" class="pixel-canvas pixel-canvas--board" width="160" height="320"
                aria-label="Playfield"></canvas>
        <div class="overlay" id="overlay">
          <p class="overlay__title" id="overlay-title">TETRIS</p>
          <p class="overlay__info" id="overlay-info">LEVEL &lt; 00 &gt;</p>
          <p class="overlay__sub blink" id="overlay-sub">PRESS ENTER
OR CLICK TO START</p>
        </div>
        <p class="sound-hint" id="sound-hint" role="status" hidden>CLICK ANYWHERE
TO ENABLE SOUND</p>
      </div>

      <aside class="panel">
        <section class="box">
          <h2 class="box__title">NEXT</h2>
          <canvas id="next-canvas" class="pixel-canvas pixel-canvas--next" width="80" height="144"></canvas>
        </section>

        <section class="box">
          <dl class="stats">
            <dt>LEVEL</dt>
            <dd id="hud-level">00</dd>
            <dt>LINES</dt>
            <dd id="hud-lines">000</dd>
          </dl>
        </section>
      </aside>
    </main>

    <nav class="touch-controls" id="touch-controls" aria-label="Touch controls">
      <div class="touch-dpad" id="touch-dpad" aria-label="Directional controls">
        <button type="button" class="touch-btn touch-btn--up" data-action="hardDrop" aria-label="Hard drop">
          <span class="touch-icon" aria-hidden="true">&#9650;</span>
          <span class="touch-label">DROP</span>
        </button>
        <button type="button" class="touch-btn touch-btn--left" data-action="left" aria-label="Move left">
          <span class="touch-icon" aria-hidden="true">&#9664;</span>
        </button>
        <div class="touch-dpad-center" aria-hidden="true"></div>
        <button type="button" class="touch-btn touch-btn--right" data-action="right" aria-label="Move right">
          <span class="touch-icon" aria-hidden="true">&#9654;</span>
        </button>
        <button type="button" class="touch-btn touch-btn--down" data-action="softDrop" aria-label="Soft drop">
          <span class="touch-icon" aria-hidden="true">&#9660;</span>
          <span class="touch-label">DOWN</span>
        </button>
      </div>

      <div class="touch-actions-group" id="touch-actions-group">
        <div class="touch-utility" id="touch-utility" aria-label="Game utility controls">
          <button type="button" class="touch-btn touch-btn--pill" data-action="hold" aria-label="Hold piece">HOLD</button>
          <button type="button" class="touch-btn touch-btn--pill" data-action="pause" aria-label="Pause game">PAUSE</button>
        </div>

        <div class="touch-actions" id="touch-actions" aria-label="Action controls">
          <button type="button" class="touch-btn touch-btn--action touch-btn--b" data-action="rotateCCW" aria-label="Rotate counter-clockwise">
            <span class="touch-letter">B</span>
            <span class="touch-sub">&#8634;</span>
          </button>
          <button type="button" class="touch-btn touch-btn--action touch-btn--a" data-action="rotateCW" aria-label="Rotate clockwise">
            <span class="touch-letter">A</span>
            <span class="touch-sub">&#8635;</span>
          </button>
        </div>
      </div>
    </nav>

    <footer class="controls-help">
      <ul>
        <li class="controls-help__kbd"><kbd>ARROWS</kbd>/<kbd>WASD</kbd> MOVE</li>
        <li class="controls-help__kbd"><kbd>UP</kbd>/<kbd>X</kbd> ROTATE</li>
        <li class="controls-help__kbd"><kbd>SPACE</kbd> DROP</li>
        <li class="controls-help__kbd"><kbd>C</kbd> HOLD</li>
        <li class="controls-help__kbd"><kbd>P</kbd> PAUSE</li>
        <li><kbd class="controls-help__kbd-hint">M</kbd> <button type="button" class="hud-toggle" id="hud-sound" aria-pressed="true">SOUND: ON</button></li>
        <li><kbd class="controls-help__kbd-hint">B</kbd> <button type="button" class="hud-toggle" id="hud-music" aria-pressed="true">MUSIC: ON</button></li>
      </ul>
    </footer>
  </div>

  <div class="crt" aria-hidden="true"></div>
</body>
</html>
